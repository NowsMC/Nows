x-nows-volumes: &nows-volumes
  - .:/workspace
  - nows-gradle-cache:/workspace/.gradle-docker
  - nows-minecraft-cache:/workspace/.nows
  - nows-npm-cache:/workspace/.npm

x-nows-common: &nows-common
  build:
    context: .
  image: nows/build:local
  working_dir: /workspace
  environment:
    CI: "true"
    GRADLE_USER_HOME: /workspace/.gradle-docker
    npm_config_cache: /workspace/.npm
    NPM_CONFIG_AUDIT: "false"
    NPM_CONFIG_FUND: "false"
    GITHUB_ACTOR: ${GITHUB_ACTOR:-}
    GITHUB_TOKEN: ${GITHUB_TOKEN:-}

services:
  nows-build:
    <<: *nows-common
    volumes: *nows-volumes
    command: ["./gradlew", "--no-parallel", "--max-workers=1", "dist"]

  nows-test:
    <<: *nows-common
    volumes: *nows-volumes
    command: ["./gradlew", "--no-parallel", "--max-workers=1", "test"]

  nows-setup:
    <<: *nows-common
    volumes: *nows-volumes
    command: ["./gradlew", "--no-parallel", "--max-workers=1", "prepareWorkspace"]

  nows-release:
    <<: *nows-common
    volumes:
      - .:/workspace
      - nows-gradle-cache:/workspace/.gradle-docker
      - nows-minecraft-cache:/workspace/.nows
      - nows-npm-cache:/workspace/.npm
      - ${GNUPGHOME:-${HOME}/.gnupg}:/root/.gnupg:ro
    command: ["./gradlew", "--no-parallel", "--max-workers=1", "publishLayout"]

  nows-shell:
    <<: *nows-common
    volumes: *nows-volumes
    stdin_open: true
    tty: true
    command: ["bash"]

  nows-web:
    <<: *nows-common
    profiles: ["web"]
    working_dir: /workspace/repos/NowsWeb
    volumes:
      - .:/workspace
      - nows-npm-cache:/workspace/.npm
      - nows-web-node-modules:/workspace/repos/NowsWeb/node_modules
    ports:
      - "${NOWS_WEB_PORT:-3000}:3000"
    command: ["bash", "-lc", "npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"]

volumes:
  nows-gradle-cache:
  nows-minecraft-cache:
  nows-npm-cache:
  nows-web-node-modules:
